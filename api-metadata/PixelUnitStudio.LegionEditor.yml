  name: LegionEditor
  nameWithType: LegionEditor
  fullName: PixelUnitStudio.LegionEditor
  type: Class
  assemblies:
  - PixelUnitStudio.Runtime
  namespace: PixelUnitStudio
  summary: "Edit screen. It does not use the existing maker screen; the whole screen is built in code.\n            The left
    is the slot list (current part art and name), the center is the preview and motions, and the right is the option grid
    of the chosen slot.\n            UI text is in English. An option is applied with one click, and the first cell \"None\"
    removes it. Randomize, undo, hero list and save are in the top bar.\n            For dyeable parts, a row of dye swatches
    appears above the options (the first cell is the original color).\n            The preview is rendered 1:1 in pixels by
    a separate camera and shown scaled up by an integer factor."
  example: []
  syntax:
    content: 'public sealed class LegionEditor : MonoBehaviour'
    content.vb: Public NotInheritable Class LegionEditor Inherits MonoBehaviour
  inheritance:
  - System.Object
