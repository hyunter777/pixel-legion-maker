  name: LegionRecipe
  nameWithType: LegionRecipe
  fullName: PixelUnitStudio.LegionRecipe
  type: Class
  assemblies:
  - PixelUnitStudio.Runtime
  namespace: PixelUnitStudio
  summary: "One hero\\'s combination written as option names. Used to assemble heroes at game runtime (LegionBuilder.Create
    / Apply).\n            As text, \"slot=option[:dye]\" entries are joined by spaces. Example: \"Helmet=helmet_mitre Cloth=robe_priest:gold
    WeaponRight=staff_sun\".\n            Written by name, so it is found correctly even if the catalog is rebuilt and the
    order changes. Slots not listed are cleared (if they can be) or set to the default.\n            The skin color is written
    like \"Skin=orc\" (LegionDye.Skins). If not written, it is the default skin."
  example: []
  syntax:
    content: public sealed class LegionRecipe
    content.vb: Public NotInheritable Class LegionRecipe
