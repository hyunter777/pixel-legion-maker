  name: LegionActionPlayer
  nameWithType: LegionActionPlayer
  fullName: PixelUnitStudio.LegionActionPlayer
  type: Class
  assemblies:
  - PixelUnitStudio.Runtime
  namespace: PixelUnitStudio
  summary: "Plays custom actions (LegionAction) on a hero: each step's motion in turn, then back to idle (an action ending
    in death stays down).\n            Saved hero prefabs carry one that references the action library of their save folder;
    heroes assembled with LegionBuilder get one from Builder.Actions.\n            While an action plays, LegionEvents.returnToIdle
    waits for the action to finish. Hit and cast events still fire for every step."
  example: []
  syntax:
    content: 'public sealed class LegionActionPlayer : MonoBehaviour'
    content.vb: Public NotInheritable Class LegionActionPlayer Inherits MonoBehaviour
  inheritance:
  - System.Object
