- uid: PixelUnitStudio.Editor.LegionImporter.BuildRigPrefab(System.String,System.String,System.String,System.String,System.String,System.Collections.Generic.Dictionary{System.String,System.String})
  commentId: M:PixelUnitStudio.Editor.LegionImporter.BuildRigPrefab(System.String,System.String,System.String,System.String,System.String,System.Collections.Generic.Dictionary{System.String,System.String})
  id: BuildRigPrefab(System.String,System.String,System.String,System.String,System.String,System.Collections.Generic.Dictionary{System.String,System.String})
  parent: PixelUnitStudio.Editor.LegionImporter
  langs:
  - csharp
  - vb
  name: BuildRigPrefab(string, string, string, string, string, Dictionary<string, string>)
  nameWithType: LegionImporter.BuildRigPrefab(string, string, string, string, string, Dictionary<string, string>)
  fullName: PixelUnitStudio.Editor.LegionImporter.BuildRigPrefab(string, string, string, string, string, System.Collections.Generic.Dictionary<string,
    string>)
  type: Method
  assemblies:
  - PixelUnitStudio.Editor
  namespace: PixelUnitStudio.Editor
  summary: "Slices a part sheet that follows the cell layout and saves it as a skeleton prefab. The weapon sheet (48×48, handle
    at the center) is optional.\n            slotSheets maps slot name (Cloth, Hair, etc.) → a slot sheet with the same cell
    layout as the body sheet. Each is attached as a child named after the slot under each bone,\n            with sorting
    value = bone sortBase + slot layer. Empty cells in a slot sheet are skipped."
  example: []
  syntax:
    content: public static GameObject BuildRigPrefab(string sheetPath, string prefabPath, string rootName, string weaponLeftPath
      = null, string weaponRightPath = null, Dictionary<string, string> slotSheets = null)
    parameters:
    - id: sheetPath
      type: System.String
    - id: prefabPath
      type: System.String
    - id: rootName
      type: System.String
    - id: weaponLeftPath
      type: System.String
    - id: weaponRightPath
      type: System.String
    - id: slotSheets
      type: System.Collections.Generic.Dictionary{System.String,System.String}
    return:
      type: UnityEngine.GameObject
    content.vb: Public Shared Function BuildRigPrefab(sheetPath As String, prefabPath As String, rootName As String, weaponLeftPath
      As String = Nothing, weaponRightPath As String = Nothing, slotSheets As Dictionary(Of String, String) = Nothing) As
      GameObject
  overload: PixelUnitStudio.Editor.LegionImporter.BuildRigPrefab*
  nameWithType.vb: LegionImporter.BuildRigPrefab(String, String, String, String, String, Dictionary(Of String, String))
  fullName.vb: PixelUnitStudio.Editor.LegionImporter.BuildRigPrefab(String, String, String, String, String, System.Collections.Generic.Dictionary(Of
    String, String))
  name.vb: BuildRigPrefab(String, String, String, String, String, Dictionary(Of String, String))
