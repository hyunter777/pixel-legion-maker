  type: Method
  assemblies:
  - PixelUnitStudio.Editor
  namespace: PixelUnitStudio.Editor
  summary: "Cuts pre-rotated weapon art (tools/generate_weapon_turns.py) cell by cell and returns it in angle order (counter-clockwise
    k×15°). Null if absent.\n            The cell size is sheet width ÷ 6, and the center of each cell is the handle."
  example: []
  syntax:
    content: public static Sprite[] ImportWeaponTurns(string path, int turnCount = 24, int columns = 6)
    parameters:
    - id: path
      type: System.String
    - id: turnCount
      type: System.Int32
    - id: columns
      type: System.Int32
    return:
      type: UnityEngine.Sprite[]
    content.vb: Public Shared Function ImportWeaponTurns(path As String, turnCount As Integer = 24, columns As Integer = 6)
      As Sprite()
