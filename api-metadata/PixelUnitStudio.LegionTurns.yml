  name: LegionTurns
  nameWithType: LegionTurns
  fullName: PixelUnitStudio.LegionTurns
  type: Class
  assemblies:
  - PixelUnitStudio.Runtime
  namespace: PixelUnitStudio
  summary: "Instead of rotating weapon art, swaps in whichever pre-rotated clean art (turns, counter-clockwise k×step°) is
    closest to the weapon angle.\n            Rotating pixel art at an arbitrary angle at runtime breaks outlines and drops
    or overlaps pixels (tools/generate_weapon_turns.py).\n            Attached to a renderer that is a child of the weapon
    bone. The motion decides the bone rotation as is, and this renderer cancels that rotation and changes only the art's direction."
  example: []
  syntax:
    content: 'public sealed class LegionTurns : MonoBehaviour'
    content.vb: Public NotInheritable Class LegionTurns Inherits MonoBehaviour
  inheritance:
  - System.Object
