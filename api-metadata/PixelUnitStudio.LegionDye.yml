  type: Method
  assemblies:
  - PixelUnitStudio.Runtime
  namespace: PixelUnitStudio
  summary: "A 5-step dye with the \"#RRGGBB\" color as the middle (step 3). The dark side gets a bit more saturation and the
    light side less, giving the same light-dark range as the base dyes.\n            Null if the format is wrong. The name
    is normalized to uppercase \"#RRGGBB\"."
  example: []
  syntax:
    content: public static LegionDye.Palette Custom(string hex)
