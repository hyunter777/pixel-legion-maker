  langs:
  - csharp
  - vb
  name: LegionDye
  nameWithType: LegionDye
  fullName: PixelUnitStudio.LegionDye
  type: Class
  assemblies:
  - PixelUnitStudio.Runtime
  namespace: PixelUnitStudio
  summary: "Dyes one part renderer. Redraws the art's main color group (the catalog option's dyeRamp, from dark colors) in
    the dye's color steps.\n            The hero's skin color (Skins) likewise redraws the 3 base body skin colors.\n            Shaders/LegionDye.shader
    does the color change; this component supplies the color pairs to change through a MaterialPropertyBlock.\n            It
    stays in saved prefabs, so they are repainted the same way."
  example: []
  syntax:
    content: 'public sealed class LegionDye : MonoBehaviour'
    content.vb: Public NotInheritable Class LegionDye Inherits MonoBehaviour
  inheritance:
  - System.Object
