- uid: PixelUnitStudio.Editor.LegionAnimation.ExportSheet(UnityEngine.GameObject,System.String,System.Collections.Generic.Dictionary{System.String,System.Int32},System.String)
  commentId: M:PixelUnitStudio.Editor.LegionAnimation.ExportSheet(UnityEngine.GameObject,System.String,System.Collections.Generic.Dictionary{System.String,System.Int32},System.String)
  id: ExportSheet(UnityEngine.GameObject,System.String,System.Collections.Generic.Dictionary{System.String,System.Int32},System.String)
  parent: PixelUnitStudio.Editor.LegionAnimation
  langs:
  - csharp
  - vb
  name: ExportSheet(GameObject, string, Dictionary<string, int>, string)
  nameWithType: LegionAnimation.ExportSheet(GameObject, string, Dictionary<string, int>, string)
  fullName: PixelUnitStudio.Editor.LegionAnimation.ExportSheet(UnityEngine.GameObject, string, System.Collections.Generic.Dictionary<string,
    int>, string)
  type: Method
  assemblies:
  - PixelUnitStudio.Editor
  namespace: PixelUnitStudio.Editor
  summary: "Renders every motion of the rig prefab frame by frame and saves them as a sheet, one motion per row.\n            Given
    a motionSet (spear, heavy, bow, etc.) it exports that weapon type's motions; left empty it exports the default (sword,
    axe, blunt) motions.\n            Frames are 64×64 by default (origin: horizontal center, ground 2px from the bottom);
    if big or long weapons have pixels outside that,\n            all frames are widened to fit (in steps of 8px horizontally
    and vertically). The origin is at the same spot in every frame, and size and origin are written to the .json."
  example: []
  syntax:
    content: public static string ExportSheet(GameObject prefab, string outputPng, Dictionary<string, int> sortOverrides =
      null, string motionSet = null)
    parameters:
    - id: prefab
      type: UnityEngine.GameObject
    - id: outputPng
      type: System.String
    - id: sortOverrides
      type: System.Collections.Generic.Dictionary{System.String,System.Int32}
    - id: motionSet
      type: System.String
    return:
      type: System.String
    content.vb: Public Shared Function ExportSheet(prefab As GameObject, outputPng As String, sortOverrides As Dictionary(Of
      String, Integer) = Nothing, motionSet As String = Nothing) As String
  overload: PixelUnitStudio.Editor.LegionAnimation.ExportSheet*
  nameWithType.vb: LegionAnimation.ExportSheet(GameObject, String, Dictionary(Of String, Integer), String)
  fullName.vb: PixelUnitStudio.Editor.LegionAnimation.ExportSheet(UnityEngine.GameObject, String, System.Collections.Generic.Dictionary(Of
    String, Integer), String)
  name.vb: ExportSheet(GameObject, String, Dictionary(Of String, Integer), String)
