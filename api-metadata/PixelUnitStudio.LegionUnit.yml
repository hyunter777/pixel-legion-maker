- uid: PixelUnitStudio.LegionUnit.Play(System.String,System.Single)
  commentId: M:PixelUnitStudio.LegionUnit.Play(System.String,System.Single)
  id: Play(System.String,System.Single)
  parent: PixelUnitStudio.LegionUnit
  langs:
  - csharp
  - vb
  name: Play(string, float)
  nameWithType: LegionUnit.Play(string, float)
  fullName: PixelUnitStudio.LegionUnit.Play(string, float)
  type: Method
  assemblies:
  - PixelUnitStudio.Runtime
  namespace: PixelUnitStudio
  summary: "Plays a motion in game. motion is one of idle, running, attack, damaged, death, cast, stun.\n            For a
    long skill, playing cast_start ends and moves on to cast_loop by itself and repeats; play cast_end when the skill ends.\n
    \           If a state matching the weapon type (motion@motionSet) exists, it is played; otherwise the default motion."
  example: []
  syntax:
    content: public void Play(string motion, float normalizedTime = 0)
    parameters:
    - id: motion
      type: System.String
    - id: normalizedTime
      type: System.Single
    content.vb: Public Sub Play(motion As String, normalizedTime As Single = 0)
  overload: PixelUnitStudio.LegionUnit.Play*
  nameWithType.vb: LegionUnit.Play(String, Single)
  fullName.vb: PixelUnitStudio.LegionUnit.Play(String, Single)
  name.vb: Play(String, Single)
