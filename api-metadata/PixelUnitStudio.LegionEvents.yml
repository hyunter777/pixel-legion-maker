  name: LegionEvents
  nameWithType: LegionEvents
  fullName: PixelUnitStudio.LegionEvents
  type: Class
  assemblies:
  - PixelUnitStudio.Runtime
  namespace: PixelUnitStudio
  summary: "Receives events from motion clips. Attached to a hero root with an Animator (saved prefabs, heroes assembled with
    LegionBuilder).\n            hit: the moment an attack lands (the moment a bow, crossbow or gun fires, or a thrown weapon
    leaves the hand), cast: the moment a cast goes out, end: end of a one-shot motion.\n            The argument is the animator
    state name (attack, attack@spear, etc.)."
  example: []
  syntax:
    content: 'public sealed class LegionEvents : MonoBehaviour'
    content.vb: Public NotInheritable Class LegionEvents Inherits MonoBehaviour
  inheritance:
  - System.Object
