  type: Method
  assemblies:
  - PixelUnitStudio.Runtime
  namespace: PixelUnitStudio
  summary: "Saves the option combination as folder/code.prefab and returns the path. Overwrites if the code is the same.\n
    \           The preview may be in a mid-motion pose, so it is reassembled fresh from the rig original and saved in the
    default pose."
  example: []
  syntax:
    content: public static string Save(LegionCatalog catalog, IReadOnlyDictionary<string, int> choice, string folder, string
      code, IReadOnlyDictionary<string, string> dyes = null, string skin = null)
    parameters:
    - id: catalog
      type: PixelUnitStudio.LegionCatalog
    - id: choice
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,System.Int32}
    - id: folder
      type: System.String
    - id: code
      type: System.String
    - id: dyes
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,System.String}
    - id: skin
      type: System.String
    return:
      type: System.String
    content.vb: Public Shared Function Save(catalog As LegionCatalog, choice As IReadOnlyDictionary(Of String, Integer), folder
      As String, code As String, dyes As IReadOnlyDictionary(Of String, String) = Nothing, skin As String = Nothing) As String
