  summary: "A custom action: existing motions chained in order under one name (a three-hit combo, a channel-and-release spell).\n
    \           Steps are motion names, not states, so one action plays on any hero with that hero's weapon-type version of
    each motion.\n            Played by LegionActionPlayer."
